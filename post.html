    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // --- 1. Firebase Initialization ---

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyCry1RbzJYQQlZxeOIHAUgpbYfCa0e_kZY",
          authDomain: "stardust-portfolio-e88eb.firebaseapp.com",
          projectId: "stardust-portfolio-e88eb",
          storageBucket: "stardust-portfolio-e88eb.firebasestorage.app",
          messagingSenderId: "229667801282",
          appId: "1:229667801282:web:0642fc618535bca5cc535b",
          measurementId: "G-0DT4NZ47FF"
        };
        // END OF FIREBASE CONFIG

        let db, auth, userId;

        // Get DOM elements
        const postTitleEl = document.getElementById('post-title');
        const postMetaEl = document.getElementById('post-meta');
        const postContentEl = document.getElementById('post-content');

        async function loadPost(postId) {
            if (!db || !userId || !postId) {
                postTitleEl.textContent = 'Error';
                postContentEl.textContent = 'Could not load post. Invalid ID or database connection.';
                return;
            }

            try {
                // We now use a simple top-level 'posts' collection
                const postsCollectionPath = "posts";
                const postDocRef = doc(db, postsCollectionPath, postId);
                const docSnap = await getDoc(postDocRef);

                if (docSnap.exists()) {
                    const post = docSnap.data();

                    // Format date
                    let postDate = post.date || 'UNKNOWN DATE';
                    try {
                        postDate = new Date(post.date).toLocaleDateString('en-US', {
                            year: 'numeric', month: 'short', day: 'numeric'
                        });
                    } catch(e) {}
                    const postCategory = post.category ? post.category.toUpperCase() : 'GENERAL';

                    // Populate the page
                    document.title = `${post.title} | Stardust Digital`;
                    postTitleEl.textContent = post.title;
                    postMetaEl.textContent = `${postDate} • ${postCategory}`;
                    // Use the new "content" field. "white-space: pre-wrap;" in CSS will handle newlines.
                    postContentEl.textContent = post.content || post.summary || "No content found for this post."; 

                } else {
                    console.log("No such document!");
                    document.title = "Post Not Found | Stardust Digital";
                    postTitleEl.textContent = 'Post Not Found';
                    postMetaEl.textContent = '404';
                    postContentEl.textContent = 'The post you are looking for does not exist or may have been moved.';
                }
            } catch (error) {
                console.error("Error fetching document:", error);
                document.title = "Error | Stardust Digital";
                postTitleEl.textContent = 'An Error Occurred';
                postContentEl.textContent = 'There was an error trying to fetch the post. Please check the console.';
            }
        }

        try {
            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const analytics = getAnalytics(app);
            auth = getAuth(app);
            db = getFirestore(app);

            // Sign in the user (anonymously for public read)
            await signInAnonymously(auth);

            // Listen for auth state changes
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    // Get post ID from URL
                    const postId = new URLSearchParams(window.location.search).get('id');
                    if (postId) {
                        loadPost(postId);
                    } else {
                        document.title = "No Post ID | Stardust Digital";
                        postTitleEl.textContent = 'No Post Specified';
                        postContentEl.textContent = 'Please provide a post ID in the URL (e.g., ?id=...).';
                    }
                }
            });

        } catch (error) {
            console.error("Firebase initialization failed:", error);
            postTitleEl.textContent = 'Connection Error';
            postContentEl.textContent = 'Could not connect to the content system.';
        }
    </script>

    <!-- JavaScript for static animations (Copied from index.html) -->
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            // --- 1. Particle Background Animation ---
            const canvas = document.getElementById('star-particles');
            const ctx = canvas.getContext('2d');
            let particles = [];
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 1;
                    this.speedX = Math.random() * 1 - 0.5;
                    this.speedY = Math.random() * 1 - 0.5;
                    this.color = `rgba(165, 180, 252, ${Math.random()})`;
                }
                update() {
                    if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                    if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
                    this.x += this.speedX;
                    this.y += this.speedY;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                let numberOfParticles = (canvas.width * canvas.height) / 9000;
                for (let i = 0; i < numberOfParticles; i++) {
                    particles.push(new Particle());
                }
            }
            initParticles();

            function connectParticles() {
                let maxDistance = 100;
                for (let a = 0; a < particles.length; a++) {
                    for (let b = a; b < particles.length; b++) {
                        let dx = particles[a].x - particles[b].x;
                        let dy = particles[a].y - particles[b].y;
                        let distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < maxDistance) {
                            ctx.strokeStyle = `rgba(199, 210, 254, ${1 - distance / max_distance})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(particles[a].x, particles[a].y);
                            ctx.lineTo(particles[b].x, particles[b].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                connectParticles();
                requestAnimationFrame(animateParticles);
            }
            animateParticles();
            
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticles();
            });
        });
    </script>
