<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Stardust Digital</title>

    <!-- Google Font (Inter & Roboto Mono) -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Google tag (gtag.js) -->

    <script>

    <style>
        /* Custom Styles */
        body {
            font-family: 'Inter', sans-serif;
            /* Custom scrollbar */
            scrollbar-width: thin;
            scrollbar-color: #4F46E5 #111827; /* thumb and track */
        }

        /* Webkit scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #4F46E5;
            border-radius: 20px;
            border: 2px solid #111827;
        }

        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }

        /* Hero typing effect cursor */
        .cursor::after {
            content: '_';
            display: inline-block;
            animation: blink 0.7s infinite;
            color: #6366F1; /* indigo-500 */
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Subtle "glitch" effect for headers */
        .glitch {
            position: relative;
            display: inline-block;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030712; /* gray-950 */
            overflow: hidden;
            clip-path: inset(50% 0 50% 0);
        }
        .glitch::before {
            left: -2px;
            text-shadow: -1px 0 #E11D48; /* rose-600 */
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: 2px;
            text-shadow: -1px 0 #3B82F6; /* blue-500 */
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(40% 0 60% 0); }
            20% { clip-path: inset(10% 0 85% 0); }
            40% { clip-path: inset(50% 0 50% 0); }
            60% { clip-path: inset(25% 0 70% 0); }
            80% { clip-path: inset(80% 0 10% 0); }
            100% { clip-path: inset(40% 0 60% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(65% 0 30% 0); }
            20% { clip-path: inset(90% 0 5% 0); }
            40% { clip-path: inset(40% 0 60% 0); }
            60% { clip-path: inset(70% 0 20% 0); }
            80% { clip-path: inset(15% 0 80% 0); }
            100% { clip-path: inset(65% 0 30% 0); }
        }

        /* Scroll-in animation classes */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Frosted glass card effect */
        .frosted-card {
            background-color: rgba(17, 24, 39, 0.5); /* gray-900 with 50% opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(55, 65, 81, 0.5); /* gray-700 with 50% opacity */
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200">

    <!-- Animated Particle Background -->
    <canvas id="star-particles" class="fixed top-0 left-0 w-full h-full -z-10 opacity-30"></canvas>

    <!-- Header / Navigation -->
    <header class="fixed top-0 left-0 w-full p-4 z-50 bg-gray-950/30 backdrop-blur-md border-b border-gray-800/50">
        <nav class="container mx-auto max-w-6xl flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-tighter text-white">
                Stardust<span class="text-indigo-400">Digital</span>
            </a>
            <div class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="index.html#about" class="text-gray-300 hover:text-indigo-400 transition-colors">About</a>
                <a href="index.html#services" class="text-gray-300 hover:text-indigo-400 transition-colors">Services</a>
                <a href="index.html#blog" class="text-gray-300 hover:text-indigo-400 transition-colors">Blog</a>
                <a href="index.html#contact" class="text-gray-300 hover:text-indigo-400 transition-colors">Contact</a>
            </div>
            <a href="index.html#contact" class="md:hidden px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-md hover:bg-indigo-500 transition-colors">
                Contact
            </a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 pt-24 pb-24 px-4">

        <!-- Post Content Container -->
        <div class="container mx-auto max-w-4xl">
            <div id="post-content" class="reveal">
                <!-- Loading State -->
                <div class="text-center">
                    <p class="text-gray-400">Loading post...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-8 px-4 border-t border-gray-800/50">
        <div class="container mx-auto max-w-6xl text-center text-gray-500 text-sm">
            <p>&copy; 2025 Paseda. All rights reserved.</p>
            <p class="mt-1">Strategize. Secure. Succeed.</p>
        </div>
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. Firebase Initialization ---
        // These global variables are provided by the environment.
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth, userId;

        try {
            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            // Sign in the user (anonymously for public read)
            if (initialAuthToken) {
                await signInWithCustomToken(auth, initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }

            // Listen for auth state changes to get the user ID
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    // Once authenticated, load the post
                    loadPost();
                }
            });

        } catch (error) {
            console.error("Firebase initialization failed:", error);
            const postContainer = document.getElementById('post-content');
            if(postContainer) postContainer.innerHTML = '<p class="text-red-400 text-center">Could not connect to content system.</p>';
        }

        // --- 2. Load Specific Post from Firestore ---
        async function loadPost() {
            if (!db || !userId) return; // Wait for Firebase to be ready

            const postContainer = document.getElementById('post-content');
            if (!postContainer) return;

            // Get post ID from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                postContainer.innerHTML = '<p class="text-red-400 text-center">No post ID provided.</p>';
                return;
            }

            try {
                // This is the public path to your posts
                const postsCollectionPath = `artifacts/${appId}/public/data/posts`;
                const postDoc = await getDoc(doc(db, postsCollectionPath, postId));

                if (postDoc.exists()) {
                    const post = postDoc.data();
                    
                    // Format date (if it exists)
                    let postDate = post.date || 'UNKNOWN DATE';
                    try {
                        postDate = new Date(post.date).toLocaleDateString('en-US', {
                            year: 'numeric', month: 'long', day: 'numeric'
                        });
                    } catch(e) {}

                    const postCategory = post.category ? post.category.toUpperCase() : 'GENERAL';

                    // Create the post HTML
                    const postHTML = `
                        <article class="frosted-card p-8 md:p-12">
                            <header class="mb-8">
                                <p class="text-sm text-indigo-400 font-mono mb-4">${postDate} • ${postCategory}</p>
                                <h1 class="text-4xl md:text-5xl font-bold text-white mb-6 glitch" data-text="${post.title}">
                                    ${post.title}
                                </h1>
                                ${post.summary ? `<p class="text-xl text-gray-300 mb-8">${post.summary}</p>` : ''}
                            </header>
                            <div class="prose prose-lg prose-invert max-w-none">
                                ${post.content ? post.content.replace(/\n/g, '<br>') : '<p class="text-gray-400">No content available.</p>'}
                            </div>
                            <footer class="mt-12 pt-8 border-t border-gray-700">
                                <a href="index.html#blog" class="inline-flex items-center text-indigo-400 hover:text-indigo-300 transition-colors font-semibold">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                                    </svg>
                                    Back to Insights
                                </a>
                            </footer>
                        </article>
                    `;
                    postContainer.innerHTML = postHTML;

                    // Trigger reveal animation
                    postContainer.classList.add('visible');

                } else {
                    postContainer.innerHTML = '<p class="text-red-400 text-center">Post not found.</p>';
                }

            } catch (error) {
                console.error("Error fetching post: ", error);
                postContainer.innerHTML = '<p class="text-red-400 text-center">Error loading post.</p>';
            }
        }

    </script>

    <!-- JavaScript for static animations -->
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {

            // --- 1. Particle Background Animation ---
            const canvas = document.getElementById('star-particles');
            const ctx = canvas.getContext('2d');
            let particles = [];
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 1;
                    this.speedX = Math.random() * 1 - 0.5;
                    this.speedY = Math.random() * 1 - 0.5;
                    this.color = `rgba(165, 180, 252, ${Math.random()})`; // indigo-300 with random alpha
                }
                update() {
                    if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                    if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
                    this.x += this.speedX;
                    this.y += this.speedY;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                let numberOfParticles = (canvas.width * canvas.height) / 9000;
                for (let i = 0; i < numberOfParticles; i++) {
                    particles.push(new Particle());
                }
            }
            initParticles();

            function connectParticles() {
                let maxDistance = 100;
                for (let a = 0; a < particles.length; a++) {
                    for (let b = a; b < particles.length; b++) {
                        let dx = particles[a].x - particles[b].x;
                        let dy = particles[a].y - particles[b].y;
                        let distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < maxDistance) {
                            ctx.strokeStyle = `rgba(199, 210, 254, ${1 - distance / maxDistance})`; // indigo-200
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(particles[a].x, particles[a].y);
                            ctx.lineTo(particles[b].x, particles[b].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                connectParticles();
                requestAnimationFrame(animateParticles);
            }
            animateParticles();
            
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticles();
            });

        });
    </script>

</body>
</html>
